<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="ギター練習中にコードフォーム、ダイアトニックコード、音名からのコード判定をすぐ確認できる練習補助ツール。">
  <meta name="theme-color" content="#f4f6f9">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none';">
  <title>Chord Atlas - ギターコード練習ツール</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header" aria-label="サイトヘッダー">
      <a class="brand" href="#lookup" aria-label="Chord Atlas ホーム">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 6.5V17.5M12 6.5V17.5M16 6.5V17.5" stroke="#fff" stroke-opacity=".6" stroke-width="1.3" stroke-linecap="round"/>
            <path d="M7 8.5H17M7 12H17M7 15.5H17" stroke="#fff" stroke-opacity=".6" stroke-width="1.3" stroke-linecap="round"/>
            <circle cx="12" cy="12" r="2.1" fill="#ffce4a"/>
            <circle cx="16" cy="15.5" r="2.1" fill="#fff"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Chord Atlas</span>
          <span class="brand-sub">ギター練習中のコード確認</span>
        </span>
      </a>

      <nav class="header-tabs" aria-label="機能切り替え">
        <a class="header-tab active" href="#lookup" data-nav="lookup">押さえ方</a>
        <a class="header-tab" href="#key" data-nav="key">ダイアトニック</a>
        <a class="header-tab" href="#identify" data-nav="identify">判定</a>
        <a class="header-tab" href="#stock" data-nav="stock">ストック<span class="tab-badge" data-stock-badge hidden></span></a>
      </nav>

      <button class="ghost-button" id="clearButton" type="button">クリア</button>
    </header>

    <main class="main">
      <section class="screen active" id="lookupScreen" aria-label="コード検索">
        <div class="pane pane-input">
          <div class="chip-section">
            <div class="row-title">ルート</div>
            <div class="root-picker" id="rootChips"></div>
          </div>
          <div class="chip-section">
            <div class="row-title">種類</div>
            <div class="type-groups" id="typeGroups"></div>
          </div>

          <label class="search-box compact" for="chordSearch">
            <span class="search-label"><span class="search-icon" aria-hidden="true">⌕</span>入力して検索</span>
            <input id="chordSearch" type="search" inputmode="text" autocomplete="off" spellcheck="false" placeholder="例: Cmaj7 / Am7 / Eaug">
          </label>
        </div>

        <div class="pane pane-result">
          <article class="result-card" id="lookupResult" aria-live="polite"></article>
        </div>

        <div class="pane pane-aux">
          <div class="chip-section history" aria-labelledby="recentTitle">
            <div class="row-title" id="recentTitle">よく使うコード</div>
            <div class="chip-row" id="recentChips"></div>
          </div>
        </div>
      </section>

      <section class="screen" id="keyScreen" aria-labelledby="keyTitle">
        <div class="pane-head">
          <h1 id="keyTitle" class="pane-title">ダイアトニックコード</h1>
          <p class="pane-hint">選んだキーのI〜vii°を、三和音・四和音とフォームで確認できます。</p>
        </div>

        <div class="key-controls">
          <div class="control-strip">
            <label>
              <span>Key</span>
              <select id="keySelect"></select>
            </label>
            <div class="segmented" role="group" aria-label="三和音と四和音">
              <button class="segment active" type="button" data-mode="triad">三和音</button>
              <button class="segment" type="button" data-mode="seventh">四和音</button>
            </div>
          </div>
          <button class="chip toggle active" id="shapeToggle" type="button" aria-pressed="true">押さえ方を表示</button>
        </div>

        <div class="diatonic-grid" id="diatonicList"></div>
      </section>

      <section class="screen" id="identifyScreen" aria-labelledby="identifyTitle">
        <div class="pane pane-input">
          <div class="pane-head">
            <h1 id="identifyTitle" class="pane-title">音からコードを調べる</h1>
            <p class="pane-hint">弾いている音を入れると、コード名の候補が出ます。</p>
          </div>

          <label class="search-box textarea-box" for="noteInput">
            <span>構成音</span>
            <textarea id="noteInput" rows="4" spellcheck="false" placeholder="例: ドミソ&#10;例: C E G&#10;例: F A C E"></textarea>
          </label>

          <div class="chip-row">
            <button class="soft-chip" type="button" data-note-example="ドミソ">ドミソ</button>
            <button class="soft-chip" type="button" data-note-example="F A C E">F A C E</button>
            <button class="soft-chip" type="button" data-note-example="D F A C">D F A C</button>
          </div>
        </div>

        <div class="pane pane-result">
          <div class="finder-results" id="finderResults" aria-live="polite"></div>
        </div>
      </section>

      <section class="screen" id="stockScreen" aria-labelledby="stockTitle">
        <div class="pane-head">
          <h1 id="stockTitle" class="pane-title">ストック</h1>
          <p class="pane-hint">練習したいコードをためて、一画面で押さえ方を見比べられます。クリアで全部消せます。</p>
        </div>
        <div class="diatonic-grid" id="stockGrid"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主要機能">
      <a class="nav-item active" href="#lookup" data-nav="lookup">
        <b>押さえ方</b>
      </a>
      <a class="nav-item" href="#key" data-nav="key">
        <b>ダイアトニック</b>
      </a>
      <a class="nav-item" href="#identify" data-nav="identify">
        <b>判定</b>
      </a>
      <a class="nav-item" href="#stock" data-nav="stock">
        <b>ストック</b><span class="tab-badge" data-stock-badge hidden></span>
      </a>
    </nav>
  </div>

  <script src="./src/app.js" defer></script>
</body>
</html>
